spring:
  application:
    name: maris-middleware
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8090}
  shutdown: graceful
  servlet:
    session:
      timeout: ${MARIS_SESSION_TIMEOUT:30m}
      cookie:
        name: MARIS_SESSION
        http-only: true
        same-site: lax
        secure: ${MARIS_SECURE_COOKIES:false}
  error:
    include-stacktrace: never
    include-message: never

maris:
  legacy:
    # The existing EGL services, unchanged. Override per environment with MARIS_LEGACY_BASE_URL.
    base-url: ${MARIS_LEGACY_BASE_URL:http://localhost:8080/MARIS_RUI_Services_Web}
    services-path: /restservices
    connect-timeout: ${MARIS_LEGACY_CONNECT_TIMEOUT:5s}
    read-timeout: ${MARIS_LEGACY_READ_TIMEOUT:60s}
    circuit-breaker-failure-rate: 50
    circuit-breaker-open-for: 30s
  catalog:
    location: classpath:legacy-catalog/
  dev-api:
    enabled: false
  security:
    csrf-enabled: true
  fleet:
    # UI yard code -> MARIS yard (MRS_YRD_TRKG.YRD_TRKG_YRD). Names as in the UI.
    yards:
      - { code: HY, legacy-code: HY,  name: Hayward Yard,       city: Hayward,                  shop: true }
      - { code: DY, legacy-code: DY,  name: Daly City Yard,     city: Daly City,                shop: true }
      - { code: BS, legacy-code: SVB, name: Berryessa Station,  city: Berryessa/North San Jose, shop: false }
      - { code: RY, legacy-code: RY,  name: Richmond Yard,      city: Richmond,                 shop: true }
      - { code: CY, legacy-code: CY,  name: Concord Yard,       city: Concord,                  shop: true }
      - { code: DP, legacy-code: DPX, name: Dublin/Pleasanton,  city: Dublin/Pleasanton,        shop: false }
      - { code: PB, legacy-code: PBX, name: Pittsburg/Baypoint, city: Pittsburg Baypoint,       shop: false }
      - { code: MB, legacy-code: MBX, name: Millbrae Storage,   city: Millbrae,                 shop: false }

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      show-components: always

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
